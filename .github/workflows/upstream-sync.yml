# 自动同步上游模板仓库（ramjananshari241/v2-test）
# 本文件放在模板仓库根目录后，所有 fork 自动继承：
#   - fork 启用 Actions 后，每 6 小时自动拉取上游 main 更新并 push 回自己的 main
#   - push 会触发 Vercel Git 集成自动重新部署该 fork 关联的 BLOG 配套
# 一次性要求：fork 创建后需在 Actions 页签启用（GitHub 默认禁用 fork 的 Actions）。
name: Sync upstream template

on:
  schedule:
    # 每 15 分钟检查上游（public 仓库 Actions 免费不限额度；无更新时空转无副作用，
    # 不 push 不触发 Vercel 部署）。模板升级后最坏 15 分钟全量同步。
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream main
        run: |
          git config user.name "template-sync-bot"
          git config user.email "template-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/ramjananshari241/v2-test.git
          git fetch upstream main
          # 无本地修改时 fast-forward；有本地修改时兜底 merge（保留本地改动）
          git merge --ff-only upstream/main 2>/dev/null || git merge -m "chore: merge upstream template main" upstream/main
          git push origin main
